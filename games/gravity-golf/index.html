<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gravity Golf</title>
<style>
  html,body{margin:0;height:100%;background:#070a1c;overflow:hidden;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;font-size:16px}
  canvas{display:block;touch-action:none}
  #ui{position:absolute;inset:0;pointer-events:none}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(7,10,28,.82);pointer-events:auto;text-align:center}
  .screen.show{display:flex}
  h1{margin:0 0 .15em;font-size:4.2em;line-height:.95;letter-spacing:.05em;color:#7cf0c5;
    text-shadow:0 .08em 0 #2a8f73,0 .2em .45em rgba(0,0,0,.55)}
  h2{margin:0 0 .5em;font-size:2.6em;color:#7cf0c5;text-shadow:0 .07em 0 #2a8f73}
  .sub{margin:0 0 1.3em;font-size:1.15em;opacity:.9;max-width:34em}
  .hint{margin-top:1.2em;font-size:.85em;opacity:.65}
  .row{display:flex;gap:.8em;margin-top:1em;flex-wrap:wrap;justify-content:center}
  .btn{font:inherit;font-weight:700;font-size:1.1em;padding:.6em 1.3em;border:0;border-radius:.55em;cursor:pointer;
    background:#7cf0c5;color:#2a1d05;box-shadow:0 .2em 0 #2a8f73}
  .btn:active{transform:translateY(.1em);box-shadow:0 .1em 0 #2a8f73}
  .btn.big{font-size:1.4em;padding:.65em 1.7em}
  .btn.alt{background:#e9eef5;color:#22303f;box-shadow:0 .2em 0 #8b97a6}
  .btn.ad{background:#8e5bd9;color:#fff;box-shadow:0 .2em 0 #55318f}
  .btn:disabled{opacity:.4;cursor:default}
  .corner{position:absolute;top:.7em;width:2.7em;height:2.7em;border-radius:.55em;border:0;font:inherit;font-weight:900;font-size:1em;
    background:rgba(0,0,0,.4);color:#fff;pointer-events:auto;cursor:pointer;z-index:5;padding:0}
  #muteBtn{right:.8em}
  #pauseBtn{right:4.1em;display:none}
  .stats{font-size:1.15em;line-height:1.7}
  .adbox{background:#000;padding:2em 3em;border-radius:.6em;font-size:1.4em}
  #adstub{z-index:10}
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#070a1c;color:#7cf0c5;font-size:22px;font-weight:800;text-align:center;padding:24px}
  #rotate .ph{font-size:64px;animation:spin 2.2s ease-in-out infinite}
  @keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
  #grid{display:grid;grid-template-columns:repeat(6,5.4em);gap:.7em}
  .lvl{font:inherit;font-weight:900;font-size:1.25em;height:3.5em;border:0;border-radius:.6em;cursor:pointer;background:#1d2647;color:#e8f6ff;box-shadow:0 .18em 0 #0c1230;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em}
  .lvl small{font-size:.55em;font-weight:700;opacity:.85;letter-spacing:.05em}
  .lvl.done small{color:#ffd166;opacity:1}
  .lvl:disabled{opacity:.3;cursor:default}
  .chap{grid-column:1/-1;text-align:left;font-weight:800;opacity:.7;font-size:.95em;margin-top:.3em}
  #stars{font-size:3em;letter-spacing:.1em;margin:.1em 0 .2em;color:#ffd166;text-shadow:0 .06em 0 #9a6b10}
  #stars .off{color:#38406a;text-shadow:none}
  #scoreName{font-size:1.6em;font-weight:900;color:#7cf0c5;margin-bottom:.3em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <button id="pauseBtn" class="corner" aria-label="Pause">❚❚</button>
    <button id="muteBtn" class="corner" aria-label="Mute">🔊</button>
    <div id="menu" class="screen show">
      <h1>GRAVITY<br>GOLF</h1>
      <p class="sub">Mini golf among the planets. Gravity bends every shot.</p>
      <div class="row"><button id="playBtn" class="btn big">▶ PLAY</button></div>
      <div id="menuInfo" class="hint" style="opacity:.9;font-size:1em"></div>
      <p class="hint">Drag back from the ball and release · or ◀ ▶ aim, ▲ ▼ power, Space shoot · R restart · M mute</p>
    </div>
    <div id="holes" class="screen">
      <h2>CHOOSE A HOLE</h2>
      <div id="grid"></div>
      <div class="row"><button id="holesBack" class="btn alt">◀ Back</button></div>
    </div>
    <div id="pause" class="screen">
      <h2>PAUSED</h2>
      <div class="row"><button id="resumeBtn" class="btn big">▶ Resume</button></div>
      <div class="row"><button id="restartBtn" class="btn alt">↺ Restart hole</button><button id="skipBtn" class="btn ad">🎬 Skip hole</button><button id="toHoles" class="btn alt">☰ Holes</button></div>
    </div>
    <div id="done" class="screen">
      <div id="scoreName"></div>
      <div id="stars"></div>
      <div id="doneStats" class="stats"></div>
      <div class="row"><button id="retryBtn" class="btn alt">↺ Again</button><button id="nextBtn" class="btn big">Next hole ▶</button></div>
    </div>
    <div id="adstub" class="screen"><div class="adbox">📺 An ad would play here<br><small>(test stub: no ad SDK loaded)</small></div></div>
  </div>
</div>
<div id="rotate"><div class="ph">📱</div>Turn your phone sideways to play</div>
<!-- SDK -->
<script src="physics.js"></script>
<script src="holes.js"></script>
<script src="game.js"></script>
</body>
</html>
