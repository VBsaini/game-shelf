<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Knot Runner</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d1c;overflow:hidden;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;font-size:16px}
  canvas{display:block;touch-action:none}
  #ui{position:absolute;inset:0;pointer-events:none}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(9,11,26,.8);pointer-events:auto;text-align:center}
  .screen.show{display:flex}
  h1{margin:0 0 .15em;font-size:4.2em;line-height:.95;letter-spacing:.05em;color:#ff6b6b;
    text-shadow:0 .08em 0 #9c2f3a,0 .2em .45em rgba(0,0,0,.55)}
  h2{margin:0 0 .5em;font-size:2.6em;color:#ff6b6b;text-shadow:0 .07em 0 #9c2f3a}
  .sub{margin:0 0 1.3em;font-size:1.15em;opacity:.9;max-width:34em}
  .hint{margin-top:1.2em;font-size:.85em;opacity:.65}
  .row{display:flex;gap:.8em;margin-top:1em;flex-wrap:wrap;justify-content:center}
  .btn{font:inherit;font-weight:700;font-size:1.1em;padding:.6em 1.3em;border:0;border-radius:.55em;cursor:pointer;
    background:#ff6b6b;color:#2a1d05;box-shadow:0 .2em 0 #9c2f3a}
  .btn:active{transform:translateY(.1em);box-shadow:0 .1em 0 #9c2f3a}
  .btn.big{font-size:1.4em;padding:.65em 1.7em}
  .btn.alt{background:#e9eef5;color:#22303f;box-shadow:0 .2em 0 #8b97a6}
  .btn.ad{background:#8e5bd9;color:#fff;box-shadow:0 .2em 0 #55318f}
  .btn:disabled{opacity:.4;cursor:default}
  .corner{position:absolute;top:.7em;width:2.7em;height:2.7em;border-radius:.55em;border:0;font:inherit;font-weight:900;font-size:1em;
    background:rgba(0,0,0,.4);color:#fff;pointer-events:auto;cursor:pointer;z-index:5;padding:0}
  #muteBtn{right:.8em}
  #pauseBtn{right:4.1em;display:none}
  .stats{font-size:1.15em;line-height:1.7}
  .adbox{background:#000;padding:2em 3em;border-radius:.6em;font-size:1.4em}
  #adstub{z-index:10}
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#0b0d1c;color:#ff6b6b;font-size:22px;font-weight:800;text-align:center;padding:24px}
  #rotate .ph{font-size:64px;animation:spin 2.2s ease-in-out infinite}
  @keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
  .btn{color:#fff}
  #shopList{display:grid;grid-template-columns:repeat(3,10em);gap:.7em;margin-bottom:.4em}
  .rope{font:inherit;border:0;border-radius:.6em;padding:.8em;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.35em;box-shadow:inset 0 0 0 2px transparent}
  .rope.on{box-shadow:inset 0 0 0 3px #ffd166}
  .rope:disabled{opacity:.4;cursor:default}
  .rope i{display:block;width:6em;height:.55em;border-radius:1em}
  .rope small{opacity:.8}
  #shopCoins{font-size:1.3em;margin-bottom:.8em;color:#ffd166;font-weight:800}
  #overWhy{font-size:1.2em;opacity:.85;margin-bottom:.4em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <button id="pauseBtn" class="corner" aria-label="Pause">❚❚</button>
    <button id="muteBtn" class="corner" aria-label="Mute">🔊</button>
    <div id="menu" class="screen show">
      <h1>KNOT<br>RUNNER</h1>
      <p class="sub">One button. Hold to swing round a post, let go to fly. Never cross your own rope.</p>
      <div class="row"><button id="playBtn" class="btn big">▶ RUN</button><button id="shopBtn" class="btn big alt">🧶 Ropes</button></div>
      <div id="menuInfo" class="stats" style="margin-top:1em"></div>
      <p class="hint">Hold the mouse, touch or Space to swing · P pause · M mute</p>
    </div>
    <div id="shop" class="screen">
      <h2>ROPES</h2>
      <div id="shopCoins"></div>
      <div id="shopList"></div>
      <div class="row"><button id="shopBack" class="btn alt">◀ Back</button></div>
    </div>
    <div id="pause" class="screen">
      <h2>PAUSED</h2>
      <div class="row"><button id="resumeBtn" class="btn big">▶ Resume</button><button id="quitBtn" class="btn alt">Quit</button></div>
    </div>
    <div id="over" class="screen">
      <h2 id="overTitle">TANGLED!</h2>
      <div id="overWhy"></div>
      <div id="overStats" class="stats"></div>
      <div class="row"><button id="reviveBtn" class="btn ad">🎬 Keep running</button><button id="doubleBtn" class="btn ad">🎬 Double coins</button></div>
      <div class="row"><button id="againBtn" class="btn big">↺ Run again</button><button id="menuBtn" class="btn alt">Menu</button></div>
    </div>
    <div id="adstub" class="screen"><div class="adbox">📺 An ad would play here<br><small>(test stub: no ad SDK loaded)</small></div></div>
  </div>
</div>
<div id="rotate"><div class="ph">📱</div>Turn your phone sideways to play</div>
<!-- SDK -->
<script src="game.js"></script>
</body>
</html>
