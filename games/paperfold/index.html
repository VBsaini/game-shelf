<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paperfold</title>
<style>
  html,body{margin:0;height:100%;background:#1d1830;overflow:hidden;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;font-size:16px}
  canvas{display:block;touch-action:none}
  #ui{position:absolute;inset:0;pointer-events:none}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(24,18,44,.8);pointer-events:auto;text-align:center}
  .screen.show{display:flex}
  h1{margin:0 0 .15em;font-size:4.4em;line-height:.95;letter-spacing:.06em;color:#fff6e0;
    text-shadow:.05em .07em 0 #8a6cf0,0 .25em .5em rgba(0,0,0,.5)}
  h2{margin:0 0 .5em;font-size:2.6em;color:#fff6e0;text-shadow:.04em .06em 0 #8a6cf0}
  .sub{margin:0 0 1.4em;font-size:1.2em;opacity:.9}
  .row{display:flex;gap:.8em;margin-top:1em;flex-wrap:wrap;justify-content:center}
  .btn{font:inherit;font-weight:700;font-size:1.1em;padding:.6em 1.3em;border:0;border-radius:.55em;cursor:pointer;
    background:#ffd166;color:#3b2a05;box-shadow:0 .2em 0 #b08a2a}
  .btn:active{transform:translateY(.1em);box-shadow:0 .1em 0 #b08a2a}
  .btn.big{font-size:1.4em;padding:.65em 1.7em}
  .btn.alt{background:#efe7ff;color:#2a2050;box-shadow:0 .2em 0 #9b8fc4}
  .btn.ad{background:#8e5bd9;color:#fff;box-shadow:0 .2em 0 #55318f}
  .btn:disabled{opacity:.4;cursor:default}
  #grid{display:grid;grid-template-columns:repeat(6,5.2em);gap:.7em}
  .lvl{font:inherit;font-weight:900;font-size:1.3em;height:3.4em;border:0;border-radius:.6em;cursor:pointer;
    background:#efe7ff;color:#2a2050;box-shadow:0 .18em 0 #9b8fc4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em}
  .lvl small{font-size:.5em;font-weight:700;opacity:.75}
  .lvl.done{background:#b9f6ca;box-shadow:0 .18em 0 #5fae7a}
  .lvl:disabled{opacity:.35;cursor:default}
  #winStats{font-size:1.2em;line-height:1.7}
  .corner{position:absolute;top:.7em;width:2.7em;height:2.7em;border-radius:.55em;border:0;font:inherit;font-weight:900;font-size:1em;
    background:rgba(0,0,0,.4);color:#fff;pointer-events:auto;cursor:pointer;z-index:5;padding:0}
  #muteBtn{right:.8em}
  #hud{display:none}
  #menuBtn{right:4em}
  #restartBtn{right:7.2em}
  #undoBtn{right:10.4em}
  #hintBtn{right:13.6em;width:auto;padding:0 .8em;background:#8e5bd9}
  #dpad{position:absolute;right:1.2em;bottom:1.2em;width:10.5em;height:10.5em;display:none;pointer-events:none}
  #dpad button{position:absolute;width:3.4em;height:3.4em;border-radius:.7em;border:0;background:rgba(255,255,255,.22);color:#fff;
    font-size:1.2em;font-weight:900;pointer-events:auto;touch-action:none}
  #dpad button:active{background:rgba(255,255,255,.45)}
  #dU{left:3.55em;top:0}#dD{left:3.55em;bottom:0}#dL{left:0;top:3.55em}#dR{right:0;top:3.55em}
  .adbox{background:#000;padding:2em 3em;border-radius:.6em;font-size:1.4em}
  #adstub{z-index:10}
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:#1d1830;color:#fff6e0;font-size:22px;font-weight:800;text-align:center;padding:24px}
  #rotate .ph{font-size:64px;animation:spin 2.2s ease-in-out infinite}
  @keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <button id="muteBtn" class="corner" aria-label="Mute">🔊</button>
    <div id="hud">
      <button id="menuBtn" class="corner" aria-label="Menu">☰</button>
      <button id="restartBtn" class="corner" aria-label="Restart">⟲</button>
      <button id="undoBtn" class="corner" aria-label="Undo">↶</button>
      <button id="hintBtn" class="corner" aria-label="Hint">🎬 Hint</button>
      <div id="dpad">
        <button id="dU" data-d="U">▲</button><button id="dL" data-d="L">◀</button>
        <button id="dR" data-d="R">▶</button><button id="dD" data-d="D">▼</button>
      </div>
    </div>

    <div id="menu" class="screen show">
      <h1>PAPERFOLD</h1>
      <p class="sub">Step into the walls. Fold your way out.</p>
      <div class="row"><button id="playBtn" class="btn big">▶ PLAY</button></div>
      <p id="menuInfo" class="sub" style="margin-top:1.2em;font-size:1em"></p>
    </div>

    <div id="levels" class="screen">
      <h2>CHOOSE A ROOM</h2>
      <div id="grid"></div>
      <div class="row"><button id="levelsBack" class="btn alt">◀ Back</button></div>
    </div>

    <div id="pause" class="screen">
      <h2>PAUSED</h2>
      <div class="row">
        <button id="resumeBtn" class="btn big">▶ Resume</button>
        <button id="pRestartBtn" class="btn alt">⟲ Restart</button>
      </div>
      <div class="row">
        <button id="skipBtn" class="btn ad">🎬 Skip this room</button>
        <button id="toLevelsBtn" class="btn alt">Rooms</button>
      </div>
    </div>

    <div id="win" class="screen">
      <h2 id="winTitle">ROOM CLEARED!</h2>
      <div id="winStats"></div>
      <div class="row">
        <button id="nextBtn" class="btn big">Next room ▶</button>
        <button id="winLevelsBtn" class="btn alt">Rooms</button>
      </div>
    </div>

    <div id="adstub" class="screen"><div class="adbox">📺 An ad would play here<br><small>(test stub: no ad SDK loaded)</small></div></div>
  </div>
</div>
<div id="rotate"><div class="ph">📱</div>Turn your phone sideways to play</div>
<!-- SDK -->
<script src="logic.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
